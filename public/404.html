<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#06b6d4" />
    <title>Page Not Found | Walnut Technologies</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #0c4a6e 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 520px; width: 100%; }
      .code {
        font-size: clamp(4rem, 15vw, 7rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 700; margin: 16px 0 8px; }
      p { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 32px; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s;
      }
      .primary { background: #2563eb; color: #fff; }
      .primary:hover { background: #1d4ed8; }
      .ghost { border: 1px solid #334155; color: #cbd5e1; }
      .ghost:hover { border-color: #64748b; background: rgba(148, 163, 184, 0.08); }
      a:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or may have been moved. Try one of these instead.</p>
      <div class="actions">
        <a class="primary" href="/">Back to Home</a>
        <a class="ghost" href="/contact">Contact Us</a>
      </div>
    </main>
  </body>
</html>
